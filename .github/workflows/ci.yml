name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run tests
        run: pytest -v --tb=short

      - name: Security audit (pip-audit)
        run: pip-audit --strict

      - name: Verify no secrets in tracked files
        run: |
          if grep -rE "(token|password|secret)\s*=\s*['\"][^'\"]+['\"]" \
            --include="*.py" --include="*.yml" --include="*.yaml" \
            app/ tests/ .github/ 2>/dev/null \
            | grep -vE "(test-token|tg_file|test|password.*=|password\s*=\s*None|=\s*[\"']test)"; then
            echo "::error::Possible hardcoded secret detected"
            exit 1
          fi
