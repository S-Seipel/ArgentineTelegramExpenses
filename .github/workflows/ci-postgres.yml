name: CI (PostgreSQL integration)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: expenses
          POSTGRES_PASSWORD: expenses
          POSTGRES_DB: expenses
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expenses -d expenses"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://expenses:expenses@localhost:5432/expenses
      TGE_PG_INTEGRATION: "1"
      TELEGRAM_BOT_TOKEN: test-token
      TELEGRAM_ALLOWED_USER_ID: "123456"
      OLLAMA_BASE_URL: http://localhost:11434
      OLLAMA_MODEL: test-model

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -U expenses -d expenses; do
            echo "Waiting for postgres..."; sleep 2;
          done

      - name: Run PostgreSQL integration tests
        run: pytest tests_postgres -v --tb=short
